services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    env_file: ../.env
    networks:
      - proxy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=50000
    volumes:
      - ./qbittorrent:/config
      - /mnt/torrents/files:/downloads
      - /mnt/torrents/watch:/watch
    ports:
      - "50000:50000/tcp"
      - "50000:50000/udp"
      - "192.168.50.50:8301:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.qbittorrent.rule=Host(`torrents.${DOMAIN}`)"
      - "traefik.http.routers.qbittorrent.entrypoints=websecure"
      - "traefik.http.routers.qbittorrent.tls.certresolver=letsencrypt"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"
      - "com.centurylinklabs.watchtower.enable=true"

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    env_file: ../.env
    networks:
      - proxy
    environment:
      PUID: 3001
      PGID: 3001
      TZ: ${TZ}
    ports:
      - "192.168.50.50:8302:8096"
    volumes:
      - ./jellyfin:/config
      - /mnt/torrents/files:/media
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "109"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.jellyfin.rule=Host(`media.${DOMAIN}`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls.certresolver=letsencrypt"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
      - "traefik.http.services.jellyfin.loadBalancer.passHostHeader=true"
      - "com.centurylinklabs.watchtower.enable=true"
    
  filebrowser:
    image: filebrowser/filebrowser:s6
    container_name: filebrowser
    restart: unless-stopped
    env_file: ../.env
    networks:
      - proxy
    volumes:
      - /mnt/torrents:/srv:rw
      - ./filebrowser/.filebrowser.json:/.filebrowser.json
      - ./filebrowser/filebrowser.db:/database/filebrowser.db
    environment:
      TZ: ${TZ}
      FB_BASEURL: /files
      PUID: 1000
      PGID: 1000
    ports:
      - "192.168.50.50:8303:80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.filebrowser.rule=Host(`files.${DOMAIN}`)"
      - "traefik.http.routers.filebrowser.entrypoints=websecure"
      - "traefik.http.routers.filebrowser.tls.certresolver=letsencrypt"
      - "traefik.http.services.filebrowser.loadbalancer.server.port=80"
      - "com.centurylinklabs.watchtower.enable=true"

  kavita:
    image: ghcr.io/kareadita/kavita:latest
    container_name: kavita
    restart: unless-stopped
    env_file: ../.env
    networks:
      - proxy
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ}
    ports:
      - "192.168.50.50:8304:5000"
    volumes:
      - /mnt/archive/library/books:/books
      - ./kavita/config:/kavita/config
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.kavita.rule=Host(`books.${DOMAIN}`)"
      - "traefik.http.routers.kavita.entrypoints=websecure"
      - "traefik.http.routers.kavita.tls.certresolver=letsencrypt"
      - "traefik.http.services.kavita.loadbalancer.server.port=5000"
      - "com.centurylinklabs.watchtower.enable=true"
    
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    env_file: ../.env
    networks:
      - proxy
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ}
    ports:
      - "192.168.50.50:8305:80"
    volumes:
      - /mnt/archive/library/audio:/audiobooks
      - ./audiobookshelf/config:/config
      - ./audiobookshelf/metadata:/metadata
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.audiobookshelf.rule=Host(`audio.${DOMAIN}`)"
      - "traefik.http.routers.audiobookshelf.entrypoints=websecure"
      - "traefik.http.routers.audiobookshelf.tls.certresolver=letsencrypt"
      - "traefik.http.services.audiobookshelf.loadbalancer.server.port=80"
      - "com.centurylinklabs.watchtower.enable=true"
    
networks:
  proxy:
    external: true
